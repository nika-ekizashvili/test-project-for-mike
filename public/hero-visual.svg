<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#111827"/>

  <!-- Window chrome -->
  <rect width="400" height="300" fill="#1f2937" rx="8"/>
  <rect width="400" height="28" fill="#0a0e27"/>

  <!-- Window controls -->
  <circle cx="20" cy="14" r="3" fill="#ef4444" opacity="0.8"/>
  <circle cx="36" cy="14" r="3" fill="#f59e0b" opacity="0.8"/>
  <circle cx="52" cy="14" r="3" fill="#10b981" opacity="0.8"/>

  <!-- Window title -->
  <text x="200" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">SS.ge + MyHome.ge Manager</text>

  <!-- Content area -->
  <rect x="0" y="28" width="400" height="272" fill="#111827"/>

  <!-- Sidebar -->
  <rect x="0" y="28" width="100" height="272" fill="#1f2937"/>

  <!-- Sidebar items -->
  <rect x="8" y="40" width="84" height="32" rx="4" fill="#1e90ff" opacity="0.2"/>
  <text x="16" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#e8e8e8">Listings</text>

  <text x="16" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">Sync</text>
  <text x="16" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">Settings</text>
  <text x="16" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">Analytics</text>

  <!-- Main content -->
  <rect x="110" y="40" width="280" height="60" fill="#374151" rx="4" stroke="#4b5563" stroke-width="1"/>
  <text x="120" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">SS.ge Listings</text>
  <text x="120" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">12 active listings</text>
  <circle cx="360" cy="70" r="14" fill="#10b981" opacity="0.2"/>
  <text x="360" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#10b981" text-anchor="middle">✓</text>

  <!-- Second listing -->
  <rect x="110" y="110" width="280" height="60" fill="#374151" rx="4" stroke="#4b5563" stroke-width="1"/>
  <text x="120" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">MyHome.ge Listings</text>
  <text x="120" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">8 active listings</text>
  <circle cx="360" cy="140" r="14" fill="#10b981" opacity="0.2"/>
  <text x="360" y="144" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#10b981" text-anchor="middle">✓</text>

  <!-- Stats -->
  <rect x="110" y="180" width="85" height="50" fill="#1e90ff" opacity="0.15" rx="4"/>
  <text x="152" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#1e90ff" text-anchor="middle">20</text>
  <text x="152" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">Total Active</text>

  <rect x="205" y="180" width="85" height="50" fill="#10b981" opacity="0.15" rx="4"/>
  <text x="247" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#10b981" text-anchor="middle">100%</text>
  <text x="247" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">Synced</text>

  <rect x="300" y="180" width="90" height="50" fill="#f59e0b" opacity="0.15" rx="4"/>
  <text x="345" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#f59e0b" text-anchor="middle">2.3h</text>
  <text x="345" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">Time Saved</text>

  <!-- Bottom action -->
  <rect x="110" y="250" width="85" height="28" fill="#1e90ff" rx="4"/>
  <text x="152" y="269" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e8e8e8" text-anchor="middle">Sync Now</text>

  <rect x="205" y="250" width="85" height="28" fill="#374151" rx="4" stroke="#4b5563" stroke-width="1"/>
  <text x="247" y="269" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">History</text>
</svg>
