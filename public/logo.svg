<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background -->
  <rect width="200" height="200" fill="#0a0a0a"/>

  <!-- Terminal frame -->
  <rect x="10" y="10" width="180" height="180" fill="#1a1a1a" stroke="#2ab59a" stroke-width="2"/>

  <!-- Title bar -->
  <rect x="10" y="10" width="180" height="20" fill="#2d2d2d" stroke="#2ab59a" stroke-width="2"/>
  <text x="20" y="23" font-family="monospace" font-size="12" fill="#2ab59a" font-weight="bold">systemctl</text>

  <!-- Content area -->
  <rect x="12" y="32" width="176" height="156" fill="#0a0a0a"/>

  <!-- Terminal text lines -->
  <text x="20" y="50" font-family="monospace" font-size="10" fill="#2ab59a">$ systemctl</text>
  <text x="20" y="65" font-family="monospace" font-size="9" fill="#999999">UNIT                 LOAD</text>
  <text x="20" y="80" font-family="monospace" font-size="9" fill="#999999">─────────────────────────</text>

  <!-- Service indicators with colors -->
  <text x="20" y="95" font-family="monospace" font-size="9" fill="#e0e0e0">● primary.service</text>
  <circle cx="18" cy="92" r="2" fill="#2ab59a"/>

  <text x="20" y="110" font-family="monospace" font-size="9" fill="#e0e0e0">● secondary.service</text>
  <circle cx="18" cy="107" r="2" fill="#1a8eff"/>

  <text x="20" y="125" font-family="monospace" font-size="9" fill="#e0e0e0">● accent.service</text>
  <circle cx="18" cy="122" r="2" fill="#ffca1a"/>

  <!-- Status indicators on right -->
  <text x="160" y="95" font-family="monospace" font-size="8" fill="#80d4c1">active</text>
  <text x="160" y="110" font-family="monospace" font-size="8" fill="#80d4c1">active</text>
  <text x="160" y="125" font-family="monospace" font-size="8" fill="#80d4c1">active</text>

  <!-- Cursor line -->
  <line x1="20" y1="140" x2="25" y2="140" stroke="#2ab59a" stroke-width="2" stroke-linecap="round"/>

  <!-- Corner accents -->
  <circle cx="20" cy="20" r="3" fill="#2ab59a" opacity="0.5"/>
  <circle cx="180" cy="20" r="3" fill="#2ab59a" opacity="0.5"/>
  <circle cx="20" cy="180" r="3" fill="#2ab59a" opacity="0.5"/>
  <circle cx="180" cy="180" r="3" fill="#2ab59a" opacity="0.5"/>
</svg>
